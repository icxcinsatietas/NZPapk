name: NZP APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project files
        run: |
          set -e
          mkdir -p nzp-android && cd nzp-android
          mkdir -p app/src/main/java/com/zr/game
          cat > app/build.gradle.kts <<'NZP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.zr.game"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.zr.game"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          NZP_EOF
          cat > app/src/main/AndroidManifest.xml <<'NZP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Zombie Rounds"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          NZP_EOF
          cat > app/src/main/java/com/zr/game/MainActivity.kt <<'NZP_EOF'
          package com.zr.game

          import android.app.Activity
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.random.Random

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  setContentView(GameView(this))
              }
          }

          class Z(var x: Float, var y: Float, var hp: Float, val sp: Float)
          class B(var x: Float, var y: Float, val vx: Float, val vy: Float, var life: Float)

          class GameView(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val zs = ArrayList<Z>()
              private val bs = ArrayList<B>()
              private var px = 0f
              private var py = 0f
              private var hp = 100f
              private var round = 0
              private var left = 0
              private var pts = 0
              private var banner = 0f
              private var cd = 0f
              private var spawnCd = 0f
              private var last = 0L
              private var over = false
              private var ready = false
              private var mId = -1
              private var mx0 = 0f
              private var my0 = 0f
              private var mx = 0f
              private var my = 0f
              private var aId = -1
              private var ax0 = 0f
              private var ay0 = 0f
              private var ax = 0f
              private var ay = 0f
              private val R = 90f

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  if (!ready) { ready = true; reset() }
              }

              private fun reset() {
                  zs.clear(); bs.clear()
                  px = width / 2f; py = height / 2f
                  hp = 100f; round = 0; pts = 0; over = false
                  nextRound()
                  last = System.nanoTime()
              }

              private fun nextRound() {
                  round++
                  left = 4 + round * 3
                  banner = 2f
                  spawnCd = 0f
              }

              private fun spawn() {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val t = Random.nextInt(4)
                  val x = when (t) { 0 -> -30f; 1 -> w + 30f; else -> Random.nextFloat() * w }
                  val y = when (t) { 2 -> -30f; 3 -> h + 30f; else -> Random.nextFloat() * h }
                  zs.add(Z(x, y, 40f + round * 10f, min(60f + round * 8f, 160f) + Random.nextFloat() * 20f))
              }

              private fun update(dt: Float) {
                  if (over) return
                  val dx = mx - mx0
                  val dy = my - my0
                  val d = hypot(dx, dy)
                  if (mId >= 0 && d > 8f) {
                      val m = min(d, R) / R
                      px = (px + dx / d * m * 230f * dt).coerceIn(20f, width - 20f)
                      py = (py + dy / d * m * 230f * dt).coerceIn(20f, height - 20f)
                  }
                  cd -= dt
                  if (aId >= 0) {
                      val fx = ax - ax0
                      val fy = ay - ay0
                      val fd = hypot(fx, fy)
                      if (fd > 20f && cd <= 0f) {
                          cd = 0.17f
                          bs.add(B(px, py, fx / fd * 900f, fy / fd * 900f, 0.8f))
                      }
                  }
                  val bi = bs.iterator()
                  while (bi.hasNext()) {
                      val b = bi.next()
                      b.x += b.vx * dt
                      b.y += b.vy * dt
                      b.life -= dt
                      var hit = false
                      for (z in zs) {
                          if (z.hp > 0 && hypot(z.x - b.x, z.y - b.y) < 26f) {
                              z.hp -= 25f
                              hit = true
                              if (z.hp <= 0) pts += 10
                              break
                          }
                      }
                      if (hit || b.life <= 0) bi.remove()
                  }
                  zs.removeAll { it.hp <= 0 }
                  if (banner > 0) {
                      banner -= dt
                  } else if (left > 0) {
                      spawnCd -= dt
                      if (spawnCd <= 0) { spawnCd = 0.7f; left--; spawn() }
                  } else if (zs.isEmpty()) {
                      nextRound()
                  }
                  var hurt = 0f
                  for (z in zs) {
                      val zx = px - z.x
                      val zy = py - z.y
                      val zd = max(1f, hypot(zx, zy))
                      if (zd > 34f) {
                          z.x += zx / zd * z.sp * dt
                          z.y += zy / zd * z.sp * dt
                      } else {
                          hurt += 25f
                      }
                  }
                  hp = min(100f, hp + 3f * dt) - hurt * dt
                  if (hp <= 0) over = true
              }

              private fun knob(cv: Canvas, x0: Float, y0: Float, x: Float, y: Float) {
                  val d = max(1f, hypot(x - x0, y - y0))
                  val m = min(d, R)
                  p.style = Paint.Style.FILL
                  cv.drawCircle(x0 + (x - x0) / d * m, y0 + (y - y0) / d * m, 36f, p)
                  p.style = Paint.Style.STROKE
              }

              override fun onDraw(cv: Canvas) {
                  val now = System.nanoTime()
                  val dt = min(0.05f, (now - last) / 1e9f)
                  last = now
                  update(dt)
                  cv.drawColor(Color.rgb(22, 20, 18))
                  p.style = Paint.Style.FILL
                  p.color = Color.rgb(70, 150, 60)
                  for (z in zs) cv.drawCircle(z.x, z.y, 24f, p)
                  p.color = Color.YELLOW
                  for (b in bs) cv.drawCircle(b.x, b.y, 6f, p)
                  p.color = Color.rgb(70, 130, 230)
                  cv.drawCircle(px, py, 20f, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 4f
                  p.color = Color.argb(120, 255, 255, 255)
                  if (mId >= 0) { cv.drawCircle(mx0, my0, R, p); knob(cv, mx0, my0, mx, my) }
                  if (aId >= 0) { cv.drawCircle(ax0, ay0, R, p); knob(cv, ax0, ay0, ax, ay) }
                  p.style = Paint.Style.FILL
                  p.color = Color.WHITE
                  p.textSize = 40f
                  p.textAlign = Paint.Align.LEFT
                  cv.drawText("Round $round   Points $pts   Zombies ${zs.size + left}", 30f, 55f, p)
                  p.color = Color.RED
                  cv.drawRect(30f, 75f, 30f + max(0f, hp) * 2f, 95f, p)
                  p.color = Color.WHITE
                  p.textAlign = Paint.Align.CENTER
                  if (banner > 0 && !over) {
                      p.textSize = 90f
                      cv.drawText("ROUND $round", width / 2f, height / 2f, p)
                  }
                  if (over) {
                      p.textSize = 70f
                      cv.drawText("You survived " + (round - 1) + " rounds", width / 2f, height / 2f - 20f, p)
                      p.textSize = 40f
                      cv.drawText("Tap to restart", width / 2f, height / 2f + 50f, p)
                  }
                  postInvalidateOnAnimation()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val a = e.actionMasked
                  if (a == MotionEvent.ACTION_DOWN || a == MotionEvent.ACTION_POINTER_DOWN) {
                      val i = e.actionIndex
                      val id = e.getPointerId(i)
                      val x = e.getX(i)
                      val y = e.getY(i)
                      if (over) { reset(); return true }
                      if (x < width / 2f) {
                          if (mId < 0) { mId = id; mx0 = x; my0 = y; mx = x; my = y }
                      } else if (aId < 0) {
                          aId = id; ax0 = x; ay0 = y; ax = x; ay = y
                      }
                  } else if (a == MotionEvent.ACTION_MOVE) {
                      for (i in 0 until e.pointerCount) {
                          val id = e.getPointerId(i)
                          if (id == mId) { mx = e.getX(i); my = e.getY(i) }
                          if (id == aId) { ax = e.getX(i); ay = e.getY(i) }
                      }
                  } else if (a == MotionEvent.ACTION_CANCEL) {
                      mId = -1; aId = -1
                  } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_POINTER_UP) {
                      val id = e.getPointerId(e.actionIndex)
                      if (id == mId) mId = -1
                      if (id == aId) aId = -1
                  }
                  return true
              }
          }
          NZP_EOF
          cat > build.gradle.kts <<'NZP_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          NZP_EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > settings.gradle.kts <<'NZP_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ZombieRounds"
          include(":app")
          NZP_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: nzp-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zombie-rounds-apk
          path: nzp-android/app/build/outputs/apk/debug/app-debug.apk
